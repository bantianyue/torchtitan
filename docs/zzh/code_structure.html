<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TorchTitan 代码结构图</title>
<link rel="stylesheet" href="style.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 8px;
    color: #1a1a2e;
  }
  .subtitle {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }
  .legend-color {
    width: 16px; height: 16px;
    border-radius: 3px;
  }
  .legend-color.core { background: #4361ee; }
  .legend-color.models { background: #3a86ff; }
  .legend-color.dist { background: #7209b7; }
  .legend-color.exp { background: #f72585; }
  .legend-color.config { background: #06d6a0; }
  .legend-color.data { background: #fb8500; }
  .legend-color.other { background: #6c757d; }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .module-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    width: 320px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .module-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }

  .card-header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #eee;
  }
  .card-header.core { background: #eef0ff; border-left: 4px solid #4361ee; }
  .card-header.models { background: #eef4ff; border-left: 4px solid #3a86ff; }
  .card-header.dist { background: #f3eefb; border-left: 4px solid #7209b7; }
  .card-header.exp { background: #feeef5; border-left: 4px solid #f72585; }
  .card-header.config { background: #e6faf3; border-left: 4px solid #06d6a0; }
  .card-header.data { background: #fff0e6; border-left: 4px solid #fb8500; }
  .card-header.other { background: #f2f2f3; border-left: 4px solid #6c757d; }

  .card-title {
    font-weight: 600;
    font-size: 15px;
  }
  .card-total {
    font-size: 13px;
    color: #666;
    font-weight: 500;
  }

  .card-body {
    padding: 8px 0;
  }

  .file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .file-item:hover { background: #f8f9fa; }
  .file-item .name {
    color: #444;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .file-item .lines {
    color: #888;
    font-size: 12px;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .subdir-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 18px;
    font-size: 13px;
    cursor: pointer;
    background: #fafafa;
    border-top: 1px solid #f0f0f0;
    font-weight: 500;
    color: #555;
    user-select: none;
  }
  .subdir-header:hover { background: #f0f0f0; }
  .subdir-header .arrow {
    font-size: 10px;
    transition: transform 0.2s;
    margin-right: 6px;
  }
  .subdir-header .arrow.open { transform: rotate(90deg); }
  .subdir-header .name { flex: 1; }
  .subdir-header .lines { color: #888; font-weight: 400; }

  .subdir-files { display: none; }
  .subdir-files.open { display: block; }
  .subdir-files .file-item { padding-left: 32px; }

  .bar-container {
    padding: 8px 18px 4px;
  }
  .bar-wrapper {
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .bar-seg {
    height: 100%;
    transition: width 0.3s;
  }

  .search-box {
    max-width: 400px;
    margin: 0 auto 20px;
    display: block;
    width: 100%;
    padding: 10px 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: #4361ee; }

  .no-result {
    text-align: center;
    color: #999;
    padding: 40px;
    display: none;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    color: #fff;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .tag.core { background: #4361ee; }
  .tag.models { background: #3a86ff; }
  .tag.dist { background: #7209b7; }
  .tag.exp { background: #f72585; }
  .tag.config { background: #06d6a0; }
  .tag.data { background: #fb8500; }
  .tag.other { background: #6c757d; }

  @media (max-width: 700px) {
    .module-card { width: 100%; }
  }
body{padding-left:280px}
</style>

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  DATA.children.forEach(mod => {
    const card = document.createElement('div');
    card.className = 'module-card';
    card.dataset.name = mod.name;

    const totalBar = DATA.total;

    const header = document.createElement('div');
    header.className = `card-header ${mod.color}`;
    header.innerHTML = `<span class="card-title">${mod.name} <span class="tag ${mod.color}">${mod.tag}</span></span><span class="card-total">${(mod.total/1000).toFixed(1)}k</span>`;
    header.onclick = () => {
      const body = card.querySelector('.card-body');
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    };
    card.appendChild(header);

    const barDiv = document.createElement('div');
    barDiv.className = 'bar-container';
    const bar = document.createElement('div');
    bar.className = 'bar-wrapper';
    const pct = (mod.total / totalBar) * 100;
    const seg = document.createElement('div');
    seg.className = `bar-seg ${mod.color}`;
    seg.style.width = pct + '%';
    // get color value
    const colorMap = {core:'#4361ee', models:'#3a86ff', dist:'#7209b7', exp:'#f72585', config:'#06d6a0', data:'#fb8500', other:'#6c757d'};
    seg.style.background = colorMap[mod.color] || '#999';
    bar.appendChild(seg);
    barDiv.appendChild(bar);
    card.appendChild(barDiv);

    const body = document.createElement('div');
    body.className = 'card-body';

    (mod.children || []).forEach(item => {
      if (item.children) {
        // Subdirectory
        const subHeader = document.createElement('div');
        subHeader.className = 'subdir-header';
        subHeader.dataset.name = item.name;
        subHeader.innerHTML = `<span class="arrow">▶</span><span class="name">${item.name}</span><span class="lines">${item.lines}行</span>`;
        const subFiles = document.createElement('div');
        subFiles.className = 'subdir-files';
        (item.children || []).forEach(sub => {
          const sf = createFileItem(sub);
          subFiles.appendChild(sf);
        });
        subHeader.onclick = () => {
          subHeader.querySelector('.arrow').classList.toggle('open');
          subFiles.classList.toggle('open');
        };
        body.appendChild(subHeader);
        body.appendChild(subFiles);
      } else {
        body.appendChild(createFileItem(item));
      }
    });

    card.appendChild(body);
    app.appendChild(card);
  });
}

function createFileItem(item) {
  const div = document.createElement('div');
  div.className = 'file-item';
  div.dataset.name = item.name;
  const desc = item.desc ? ` (${item.desc})` : '';
  div.innerHTML = `<span class="name">${item.name}</span><span class="lines">${item.lines}行</span>`;
  div.title = `${item.name} — ${item.lines}行${desc}`;
  return div;
}

function filterFiles(val) {
  const q = val.toLowerCase().trim();
  const cards = document.querySelectorAll('.module-card');
  let anyVisible = false;
  cards.forEach(card => {
    const allItems = card.querySelectorAll('[data-name]');
    let cardMatch = false;
    allItems.forEach(el => {
      const name = (el.dataset.name || '').toLowerCase();
      if (!q || name.includes(q)) {
        el.style.display = 'flex';
        cardMatch = true;
        // Open parent subdir if applicable
        const parent = el.closest('.subdir-files');
        if (parent) {
          parent.classList.add('open');
          const arrow = parent.previousElementSibling?.querySelector('.arrow');
          if (arrow) arrow.classList.add('open');
        }
      } else {
        if (el.classList.contains('subdir-header')) {
          el.style.display = q ? 'none' : 'flex';
        } else if (el.classList.contains('file-item')) {
          el.style.display = q ? 'none' : 'flex';
        }
      }
    });
    // Check if card has any visible file-item or subdir-header
    const visibleItems = card.querySelectorAll('.file-item, .subdir-header');
    let hasVisible = false;
    visibleItems.forEach(el => {
      if (el.style.display !== 'none') hasVisible = true;
    });
    card.style.display = (!q || cardMatch || hasVisible) ? '' : 'none';
    if (card.style.display !== 'none') anyVisible = true;
    if (q) card.querySelector('.card-body').style.display = 'block';
  });
  document.getElementById('noResult').style.display = (q && !anyVisible) ? 'block' : 'none';
}

render();
